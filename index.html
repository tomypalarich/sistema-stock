<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Stock y Precios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>📦 Sistema de Stock y Precios</h1>

    <!-- PESTAÑAS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('tab-stock', this)">📦 Stock y Precios</button>
        <button class="tab-btn" onclick="showTab('tab-ventas', this)">🛒 Nueva Venta</button>
        <button class="tab-btn" onclick="showTab('tab-historial', this)">📋 Historial</button>
    </div>

    <!-- ===== PESTAÑA 1: STOCK ===== -->
    <div id="tab-stock" class="tab-content active">

        <!-- DASHBOARD -->
        <div id="dashboard"></div>

        <!-- BOTONES DE ACCION -->
        <div style="margin:10px;">
            <button onclick="sortByPrice()">Ordenar por Precio</button>
            <button onclick="sortByStock()">Ordenar por Stock</button>
            <button onclick="exportToExcel()">Exportar a Excel</button>
            <button onclick="clearAll()" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">Borrar Todo</button>
        </div>

        <!-- BUSCADOR -->
        <input type="text" id="searchBox" placeholder="Buscar producto o categoría..." onkeyup="searchProduct()">

        <!-- FORMULARIO -->
        <div class="container">
            <h2 id="formTitle">Agregar Producto</h2>
            <input type="text" id="productName" placeholder="Nombre del producto">
            <input type="number" id="productPriceSale" placeholder="Precio de venta ($)" min="0" step="0.01">
            <input type="number" id="productPriceCost" placeholder="Precio de costo ($)" min="0" step="0.01">
            <input type="number" id="productQuantity" placeholder="Cantidad en stock" min="0">
            <input type="number" id="productMinStock" placeholder="Stock mínimo (alerta)" min="0">
            <input type="text" id="productCategory" placeholder="Categoría (ej: Cuadernos, Útiles)">
            <button onclick="addProduct()">Agregar / Actualizar Producto</button>
            <button onclick="cancelEdit()" id="btnCancelar" style="display:none; background: linear-gradient(135deg, #95a5a6, #7f8c8d);">Cancelar</button>
        </div>

        <!-- LISTA DE PRODUCTOS -->
        <div id="productList"></div>
    </div>

    <!-- ===== PESTAÑA 2: NUEVA VENTA ===== -->
    <div id="tab-ventas" class="tab-content">

        <div class="container" style="width:90%; max-width:600px;">
            <h2>🛒 Nueva Venta</h2>

            <!-- Buscador de producto para venta -->
            <input type="text" id="ventaSearch" placeholder="Buscar producto para agregar..." oninput="ventaFiltrar()" style="max-width:100%;">
            <div id="ventaSugerencias"></div>

            <!-- Carrito interno -->
            <div id="carritoContainer" style="margin-top:15px;">
                <h3 style="margin-bottom:8px;">Productos en esta venta:</h3>
                <div id="carritoLista"></div>
                <div id="carritoTotal" style="font-size:16px; font-weight:bold; margin-top:10px;"></div>
            </div>

            <!-- Medio de pago -->
            <div style="margin-top:15px;">
                <label style="font-weight:bold;">Medio de pago:</label><br><br>
                <label><input type="radio" name="medioPago" value="efectivo" checked> 💵 Efectivo</label>
                &nbsp;&nbsp;
                <label><input type="radio" name="medioPago" value="transferencia"> 📲 Transferencia</label>
            </div>

            <br>
            <button onclick="confirmarVenta()" style="background: linear-gradient(135deg, #2980b9, #1a6fa0); width:100%; padding:14px; font-size:15px;">
                ✅ Confirmar Venta
            </button>
            <button onclick="limpiarCarrito()" style="background: linear-gradient(135deg, #95a5a6, #7f8c8d); width:100%; margin-top:5px;">
                🗑 Vaciar carrito
            </button>
        </div>
    </div>

    <!-- ===== PESTAÑA 3: HISTORIAL ===== -->
    <div id="tab-historial" class="tab-content">
        <div style="max-width:700px; margin:20px auto;">

            <!-- Resumen semanal y mensual -->
            <div id="resumenVentas"></div>

            <!-- Filtro por fecha -->
            <div class="container" style="width:90%; max-width:600px;">
                <h3>🔍 Filtrar historial</h3>
                <label style="font-size:13px;">Desde:</label>
                <input type="date" id="filtroDesde" style="width:auto; margin:5px;">
                <label style="font-size:13px;">Hasta:</label>
                <input type="date" id="filtroHasta" style="width:auto; margin:5px;">
                <br>
                <button onclick="filtrarHistorial()">Filtrar</button>
                <button onclick="mostrarTodoHistorial()" style="background: linear-gradient(135deg, #95a5a6, #7f8c8d);">Ver todo</button>
                <button onclick="exportarHistorialExcel()" style="background: linear-gradient(135deg, #27ae60, #1e8449);">Exportar a Excel</button>
            </div>

            <!-- Lista de ventas -->
            <div id="historialLista"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
