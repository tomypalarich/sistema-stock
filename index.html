<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Stock y Precios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>📦 Sistema de Stock y Precios</h1>

    <!-- PESTAÑAS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('tab-stock', this)">📦 Stock y Precios</button>
        <button class="tab-btn" onclick="showTab('tab-ventas', this)">🛒 Nueva Venta</button>
        <button class="tab-btn" onclick="showTab('tab-historial', this)">📋 Historial</button>
    </div>

    <!-- ===== PESTAÑA 1: STOCK ===== -->
    <div id="tab-stock" class="tab-content active">

        <div id="dashboard"></div>

        <!-- Botones acciones -->
        <div style="margin:10px;">
            <button onclick="sortByName()">Ordenar A-Z</button>
            <button onclick="sortByPrice()">Ordenar por Precio</button>
            <button onclick="sortByStock()">Ordenar por Stock</button>
            <button onclick="exportToExcel()" class="btn-green">Exportar a Excel</button>
            <button onclick="clearAll()" class="btn-danger">Borrar Todo</button>
        </div>

        <!-- Botón para abrir/cerrar formulario -->
        <div style="margin:10px;">
            <button class="form-toggle-btn" onclick="toggleFormulario()">➕ Agregar Producto</button>
        </div>

        <!-- FORMULARIO COLAPSABLE -->
        <div id="formContainer" style="display:none;">
            <div class="container">
                <h2 id="formTitle" style="color:var(--text); margin-bottom:14px;">Agregar Producto</h2>
                <input type="text"   id="productName"      placeholder="Nombre del producto">
                <input type="number" id="productPriceSale" placeholder="Precio de venta ($)" min="0" step="0.01">
                <input type="number" id="productPriceCost" placeholder="Precio de costo ($)" min="0" step="0.01">
                <input type="number" id="productQuantity"  placeholder="Cantidad en stock"   min="0">
                <input type="number" id="productMinStock"  placeholder="Stock mínimo (alerta)" min="0">
                <input type="text"   id="productCategory"  placeholder="Categoría (ej: Cuadernos, Útiles)">
                <br>
                <button onclick="addProduct()">Guardar Producto</button>
                <button onclick="cancelEdit()" id="btnCancelar" class="btn-gray" style="display:none;">Cancelar edición</button>
                <button onclick="toggleFormulario()" class="btn-gray">Cerrar ✕</button>
            </div>
        </div>

        <!-- BUSCADOR -->
        <div style="margin:10px;">
            <input type="text" id="searchBox" placeholder="🔍 Buscar producto o categoría..." onkeyup="searchProduct()" style="max-width:360px; width:90%;">
        </div>

        <!-- TABLA DE PRODUCTOS -->
        <div class="tabla-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio Venta</th>
                        <th>Precio Costo</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productList"></tbody>
            </table>
        </div>
    </div>

    <!-- ===== PESTAÑA 2: NUEVA VENTA ===== -->
    <div id="tab-ventas" class="tab-content">
        <div class="container-dark">
            <h2>🛒 Nueva Venta</h2>
            <input type="text" id="ventaSearch" placeholder="Buscar producto para agregar..." oninput="ventaFiltrar()" style="max-width:100%; width:100%;">
            <div id="ventaSugerencias"></div>

            <div id="carritoContainer" style="margin-top:15px;">
                <h3 style="margin-bottom:8px; color:var(--text2); font-size:14px;">PRODUCTOS EN ESTA VENTA:</h3>
                <div id="carritoLista"></div>
                <div id="carritoTotal" style="font-size:16px; font-weight:bold; margin-top:10px; color:var(--accent);"></div>
            </div>

            <div style="margin-top:16px; text-align:left;">
                <label style="font-weight:bold; color:var(--text2); font-size:13px;">MEDIO DE PAGO:</label><br><br>
                <label style="color:var(--text);"><input type="radio" name="medioPago" value="efectivo" checked> 💵 Efectivo</label>
                &nbsp;&nbsp;
                <label style="color:var(--text);"><input type="radio" name="medioPago" value="transferencia"> 📲 Transferencia</label>
            </div>
            <br>
            <button onclick="confirmarVenta()" style="width:100%; padding:14px; font-size:15px;">✅ Confirmar Venta</button>
            <button onclick="limpiarCarrito()" class="btn-gray" style="width:100%; margin-top:6px;">🗑 Vaciar carrito</button>
        </div>
    </div>

    <!-- ===== PESTAÑA 3: HISTORIAL ===== -->
    <div id="tab-historial" class="tab-content">
        <div style="max-width:700px; margin:20px auto;">

            <div id="resumenVentas"></div>

            <div class="container-dark">
                <h3>🔍 Filtrar historial</h3>
                <label style="font-size:13px; color:var(--text2);">Desde:</label>
                <input type="date" id="filtroDesde" style="width:auto; margin:5px;">
                <label style="font-size:13px; color:var(--text2);">Hasta:</label>
                <input type="date" id="filtroHasta" style="width:auto; margin:5px;">
                <br>
                <button onclick="filtrarHistorial()">Filtrar</button>
                <button onclick="mostrarTodoHistorial()" class="btn-gray">Ver todo</button>
                <button onclick="exportarHistorialExcel()" class="btn-green">Exportar a Excel</button>
            </div>

            <div id="historialLista"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
